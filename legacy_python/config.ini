# ==================== 全局设置 ====================
[common]
speed = 2.0
notopen_action = continue
debug = false
# 多账号并行数（同时刷课的账号数量）
max_account_workers = 2

# ==================== 题库设置 ====================
[tiku]
# 题库选择: TikuZError / TikuLocal / TikuAdapter / TikuYanxi / TikuLike / AI / SiliconFlow
provider = TikuZError

# 是否自动提交答案（true/false）
submit = true

# 答案覆盖率阈值(0-1)，低于此值不提交
cover_rate = 0.8

# === ZError/本地题库/TikuAdapter配置 ===
# 题库API地址（选择ZError/本地题库/TikuAdapter时使用）
# ZError题库地址格式: http://your-server:5555/query
# TikuAdapter地址格式: http://your-server:8060/adapter-service/search?use=local,icodef
local_api = http://192.168.100.200:5555/query

# === 其他题库Token配置 ===
# 题库Token（选择言溪/LIKE等题库时使用）
tokens = 

# === 判断题关键词 ===
true_list = 正确,对,√,是
false_list = 错误,错,×,否,不对,不正确

# === AI题库配置 ===
# AI题库Endpoint
endpoint = 
# AI题库API Key
