name = "cx-auto-study"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Pages 构建输出目录（next-on-pages 产物）
pages_build_output_dir = ".vercel/output/static"

# Cloudflare D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "cx_auto_study"
database_id = "d642f202-0776-42dc-8249-a16d34dd2f0f"

[vars]
ENVIRONMENT = "production"

# 敏感环境变量请在 Cloudflare 控制台或用 secret 设置，切勿写入本文件：
#   APP_SECRET         会话与本地凭据加密主密钥（至少 32 位随机字符串）
#   ADMIN_SETUP_CODE   注册首位管理员所需的邀请码（可选）
# 本地开发可在 .dev.vars 中设置：
#   APP_SECRET="dev-only-please-change-to-a-long-random-secret"
#   ADMIN_SETUP_CODE="setup-code"
