# ============================================================
# Chaoxing Web 配置文件模板
# 复制此文件为 config.ini 并填入你的实际配置
# ============================================================

# ==================== 多账号配置 ====================
# 支持多账号同时刷课，每个账号使用 [account_N] 格式
# N 从 1 开始递增，可以添加任意数量的账号

[account_1]
# 账号1 - 超星学习通手机号
username = 
# 账号1 - 登录密码
password = 
# 账号1 - 指定课程ID（可选，留空学习所有课程）
# 多个课程用逗号分隔，如：courses = 123456,789012
courses = 

[account_2]
# 账号2（如不需要可删除此区块）
username = 
password = 
courses = 

# [account_3]
# 账号3（继续添加更多账号...）
# username = 
# password = 
# courses = 

# ==================== 全局设置 ====================
[common]
# 视频播放倍速（1.0-2.0，推荐2.0）
speed = 2.0
# 遇到未开放章节的行为：retry/ask/continue
# retry: 重试
# ask: 询问用户
# continue: 跳过并继续
notopen_action = continue
# 是否启用调试模式
debug = false
# 多账号并行数（同时刷课的账号数量，建议1-3）
max_account_workers = 2

# ==================== 题库设置 ====================
[tiku]
# 题库选择: TikuZError / TikuLocal / TikuAdapter / TikuYanxi / TikuLike / AI / SiliconFlow
# TikuZError: ZError题库（推荐，支持OCS网课助手）
# TikuLocal: 本地题库API
# TikuAdapter: TikuAdapter题库
# TikuYanxi: 言溪题库
# TikuLike: LIKE知识库
# AI: AI大模型答题
# SiliconFlow: 硅基流动大模型
provider = TikuZError
# 是否自动提交答案（true/false）
submit = true
# 答案覆盖率阈值(0-1)，低于此值不提交（仅当submit=false时生效）
cover_rate = 0.8

# === ZError/本地题库/TikuAdapter配置 ===
# API地址（选择ZError/TikuLocal/TikuAdapter时使用）
# ZError格式: http://your-server:5555/query
# TikuAdapter格式: http://your-server:8060/adapter-service/search?use=local,icodef
local_api = http://192.168.100.200:5555/query

# === 其他题库Token配置 ===
# 题库Token（选择言溪/LIKE等题库时使用）
tokens = 

# === 判断题关键词 ===
true_list = 正确,对,√,是
false_list = 错误,错,×,否,不对,不正确

# ============================================================
# 单账号配置兼容模式（旧格式仍然支持）
# 如果不使用多账号，可以使用以下简化配置：
# ============================================================
# [common]
# username = 你的手机号
# password = 你的密码
# course_list = 
# speed = 2.0
# notopen_action = continue
